<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Búsqueda multimodal — BBC News</title>
  <style>
    :root {
      --bg: #fafafa; --panel: #fff; --border: #e4e4e7; --text: #18181b;
      --muted: #71717a; --accent: #2563eb; --accent-soft: #eff6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      max-width: 860px; margin: 0 auto; padding: 32px 20px;
    }
    h1 { font-size: 20px; font-weight: 600; }
    p.sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab {
      padding: 8px 14px; border: 1px solid var(--border); background: var(--panel);
      border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--muted);
    }
    .tab.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; margin-bottom: 24px;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input[type="text"] {
      flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px;
    }
    input[type="file"] { font-size: 14px; }
    button {
      padding: 10px 18px; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    label.alpha { font-size: 13px; color: var(--muted); display: block; margin-top: 12px; }
    .results { display: grid; gap: 10px; }
    .card {
      display: flex; gap: 14px; padding: 12px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--panel);
    }
    .card img { width: 96px; height: 72px; object-fit: cover; border-radius: 6px; background: #f4f4f5; }
    .card .meta { flex: 1; min-width: 0; }
    .card .title { font-weight: 500; font-size: 14px; }
    .card .tags { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .badge {
      display: inline-block; background: var(--accent-soft); color: var(--accent);
      padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 500;
    }
    .empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Búsqueda multimodal — BBC News</h1>
  <p class="sub">Recuperación por texto, por imagen o combinando ambas modalidades.</p>

  <div class="tabs">
    <div class="tab active" data-mode="text">Texto</div>
    <div class="tab" data-mode="image">Imagen</div>
    <div class="tab" data-mode="multimodal">Multimodal</div>
  </div>

  <div class="panel">
    <div class="row">
      <input type="text" id="query" placeholder="Escribe una consulta, p. ej. russia ukraine war">
      <input type="file" id="file" accept="image/*" class="hidden">
      <button id="buscar">Buscar</button>
    </div>
    <label class="alpha hidden" id="alphaWrap">
      Peso del texto: <span id="alphaVal">0.5</span>
      <input type="range" id="alpha" min="0" max="1" step="0.1" value="0.5" style="width:200px;vertical-align:middle">
    </label>
  </div>

  <div class="results" id="results"></div>

  <script>
    const API = "http://localhost:8000";
    let mode = "text";

    const $ = (id) => document.getElementById(id);
    const queryInput = $("query"), fileInput = $("file");
    const alphaWrap = $("alphaWrap"), alpha = $("alpha"), alphaVal = $("alphaVal");

    document.querySelectorAll(".tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        mode = tab.dataset.mode;
        queryInput.classList.toggle("hidden", mode === "image");
        fileInput.classList.toggle("hidden", mode === "text");
        alphaWrap.classList.toggle("hidden", mode !== "multimodal");
      };
    });
    alpha.oninput = () => alphaVal.textContent = alpha.value;

    $("buscar").onclick = async () => {
      const fd = new FormData();
      fd.append("top_n", 10);
      let endpoint;
      if (mode === "text") {
        endpoint = "/search/text";
        fd.append("query", queryInput.value);
      } else if (mode === "image") {
        endpoint = "/search/image";
        if (!fileInput.files[0]) return alert("Selecciona una imagen");
        fd.append("file", fileInput.files[0]);
      } else {
        endpoint = "/search/multimodal";
        fd.append("query", queryInput.value);
        fd.append("alpha", alpha.value);
        if (fileInput.files[0]) fd.append("file", fileInput.files[0]);
      }

      $("results").innerHTML = '<p class="empty">Buscando…</p>';
      try {
        const res = await fetch(API + endpoint, { method: "POST", body: fd });
        render((await res.json()).results || []);
      } catch (e) {
        $("results").innerHTML = '<p class="empty">Error de conexión con el backend.</p>';
      }
    };

    function render(results) {
      if (!results.length) {
        $("results").innerHTML = '<p class="empty">Sin resultados.</p>';
        return;
      }
      $("results").innerHTML = results.map(r => `
        <a class="card" href="${r.url}" target="_blank" style="text-decoration:none;color:inherit">
          <img src="${r.image_url || ''}" onerror="this.style.visibility='hidden'">
          <div class="meta">
            <div class="title">${r.title || '(sin título)'}</div>
            <div class="tags">
              ${r.category ? `<span class="badge">${r.category}</span>` : ''}
              · score ${r.score.toFixed(3)}
            </div>
          </div>
        </a>
      `).join("");
    }
  </script>
</body>
</html>
